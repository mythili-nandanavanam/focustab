<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOCUSTAB Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0e;
      --surface: #0f1318;
      --card: #13181f;
      --border: #1e2530;
      --accent: #00e5a0;
      --accent2: #3b82f6;
      --accent3: #f97316;
      --text: #dde2ea;
      --muted: #4d5a6b;
      --heading: #f0f4ff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .logo span { color: var(--heading); }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .url-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 7px 12px;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
    }
    .url-input:focus { border-color: var(--accent); }

    .refresh-btn {
      background: var(--accent);
      color: #080a0e;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .refresh-btn:hover { opacity: 0.88; }
    .refresh-btn:active { transform: scale(0.97); }
    .refresh-btn.loading { opacity: 0.5; pointer-events: none; }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-box {
      background: var(--surface);
      padding: 20px 28px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--heading);
      line-height: 1;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Main grid ── */
    .main {
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .card.wide { grid-column: 1 / -1; }
    .card.tall { min-height: 300px; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: 0.02em;
    }
    .card-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge-today { background: rgba(0,229,160,0.12); color: var(--accent); }
    .badge-week { background: rgba(59,130,246,0.12); color: var(--accent2); }

    canvas { max-height: 220px; }

    /* ── Insights ── */
    .insights-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .insight-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      transition: border-color 0.2s;
    }
    .insight-item:nth-child(2) { border-left-color: var(--accent2); }
    .insight-item:nth-child(3) { border-left-color: var(--accent3); }
    .insight-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding-top: 1px;
      min-width: 18px;
    }
    .insight-text { font-size: 13px; line-height: 1.55; color: var(--text); }

    /* ── Domain list (top domains fallback table) ── */
    .domain-table { width: 100%; }
    .domain-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .domain-row:last-child { border-bottom: none; }
    .domain-name { flex: 1; font-size: 12px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .domain-bar-bg { flex: 2; height: 4px; background: var(--border); border-radius: 2px; }
    .domain-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .domain-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); min-width: 48px; text-align: right; }

    /* ── Empty / error states ── */
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #ef4444;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">FOCUS<span>TAB</span></div>
  <div class="controls">
    <input class="url-input" id="backend-url" type="text" value="http://localhost:8000">
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
  </div>
</div>

<div class="stats-row">
  <div class="stat-box">
    <div class="stat-label">Total Today</div>
    <div class="stat-value accent" id="stat-total">—</div>
    <div class="stat-sub">across all sites</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Focus Ratio</div>
    <div class="stat-value" id="stat-focus">—</div>
    <div class="stat-sub">work + learning</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Avg Session</div>
    <div class="stat-value" id="stat-session">—</div>
    <div class="stat-sub">per tab visit</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Tab Switches</div>
    <div class="stat-value" id="stat-switches">—</div>
    <div class="stat-sub">per hour today</div>
  </div>
</div>

<main class="main">
  <div class="card tall">
    <div class="card-header">
      <span class="card-title">Peak Hours</span>
      <span class="card-badge badge-today">Today</span>
    </div>
    <canvas id="peakHoursChart" height="220"></canvas>
  </div>

  <div class="card tall">
    <div class="card-header">
      <span class="card-title">Top Domains</span>
      <span class="card-badge badge-today">Today</span>
    </div>
    <div id="topDomainsWrap"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Category Breakdown</span>
      <span class="card-badge badge-week">This Week</span>
    </div>
    <canvas id="categoryChart" height="220"></canvas>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Focus vs Distraction</span>
      <span class="card-badge badge-week">This Week</span>
    </div>
    <canvas id="focusChart" height="220"></canvas>
  </div>

  <div class="card wide">
    <div class="card-header">
      <span class="card-title">Weekly Productivity Insights</span>
      <span class="card-badge badge-week">AI Generated</span>
    </div>
    <ol class="insights-list" id="insights-list">
      <li class="empty">Loading insights…</li>
    </ol>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ── Helpers ──────────────────────────────────────────────
  const charts = {};

  function fmtSeconds(s) {
    s = Math.round(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${sec}s`;
    return `${sec}s`;
  }

  function fmtPct(ratio) {
    return `${Math.round(ratio * 100)}%`;
  }

  function destroyChart(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 4000);
  }

  function baseUrl() {
    return document.getElementById("backend-url").value.trim().replace(/\/$/, "") || "http://localhost:8000";
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
    return res.json();
  }

  // ── Chart defaults ────────────────────────────────────────
  Chart.defaults.color = "#4d5a6b";
  Chart.defaults.borderColor = "#1e2530";
  Chart.defaults.font.family = "'DM Sans', sans-serif";

  // ── Renderers ─────────────────────────────────────────────
  function renderPeakHours(data) {
    destroyChart("peak");
    const hours = data.peak_usage_hours || [];
    if (!hours.length) return;

    // Fill all 24h, set peak hours as values
    const labels = Array.from({length: 24}, (_, i) => `${String(i).padStart(2,'0')}:00`);
    const values = Array(24).fill(0);
    hours.forEach(h => { values[h.hour] = h.duration_seconds; });

    const ctx = document.getElementById("peakHoursChart");
    charts["peak"] = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: values.map(v => v > 0 ? "rgba(0,229,160,0.7)" : "rgba(30,37,48,0.5)"),
          borderRadius: 3,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => fmtSeconds(ctx.raw) }
        }},
        scales: {
          x: { ticks: { maxTicksLimit: 8, font: { size: 10 } } },
          y: { ticks: { callback: v => fmtSeconds(v), font: { size: 10 } } }
        }
      }
    });
  }

  function renderTopDomains(data) {
    const wrap = document.getElementById("topDomainsWrap");
    const entries = Object.entries(data.total_time_per_domain || {}).slice(0, 8);
    if (!entries.length) { wrap.innerHTML = '<div class="empty">No domain data yet</div>'; return; }

    const maxVal = entries[0][1];
    wrap.innerHTML = '<div class="domain-table">' + entries.map(([domain, secs]) => `
      <div class="domain-row">
        <span class="domain-name">${domain}</span>
        <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${Math.round(secs/maxVal*100)}%"></div></div>
        <span class="domain-time">${fmtSeconds(secs)}</span>
      </div>
    `).join('') + '</div>';
  }

  function renderCategory(data) {
    destroyChart("cat");
    const entries = Object.entries(data.total_time_per_category || {});
    if (!entries.length) return;
    const COLORS = ["#00e5a0","#3b82f6","#f97316","#a855f7","#ec4899","#eab308","#6b7280"];
    const ctx = document.getElementById("categoryChart");
    charts["cat"] = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: entries.map(([k]) => k),
        datasets: [{ data: entries.map(([,v]) => v), backgroundColor: COLORS, borderWidth: 0 }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "right", labels: { font: { size: 11 }, padding: 12 } },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${fmtSeconds(ctx.raw)}` } }
        }
      }
    });
  }

  function renderFocusRatio(data) {
    destroyChart("focus");
    const ratio = data.focus_vs_distraction_ratio || {};
    const focus = ratio.focus || 0;
    const distraction = ratio.distraction || 0;
    const neither = Math.max(0, 1 - focus - distraction);

    const ctx = document.getElementById("focusChart");
    charts["focus"] = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Focus", "Distraction", "Other"],
        datasets: [{
          data: [focus, distraction, neither],
          backgroundColor: ["#00e5a0", "#ef4444", "#1e2530"],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "right", labels: { font: { size: 11 }, padding: 12 } },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${fmtPct(ctx.raw)}` } }
        }
      }
    });
  }

  function renderInsights(insights) {
    const list = document.getElementById("insights-list");
    const tips = insights.insights || [];
    if (!tips.length) { list.innerHTML = '<li class="empty">No insights yet — browse for a week first.</li>'; return; }
    list.innerHTML = tips.map((tip, i) => `
      <li class="insight-item">
        <span class="insight-num">0${i+1}</span>
        <span class="insight-text">${tip}</span>
      </li>
    `).join('');
  }

  function updateStats(daily, weekly) {
    const totalSecs = Object.values(daily.total_time_per_domain || {}).reduce((a, b) => a + b, 0);
    document.getElementById("stat-total").textContent = totalSecs ? fmtSeconds(totalSecs) : "—";

    const ratio = weekly.focus_vs_distraction_ratio || {};
    document.getElementById("stat-focus").textContent = fmtPct(ratio.focus || 0);

    document.getElementById("stat-session").textContent = fmtSeconds(daily.average_session_duration || 0);
    document.getElementById("stat-switches").textContent =
      (daily.tab_switch_frequency_per_hour || 0).toFixed(1) + "/hr";
  }

  // ── Main refresh ──────────────────────────────────────────
  async function refresh() {
    const btn = document.getElementById("refresh-btn");
    btn.classList.add("loading");
    btn.textContent = "Loading…";

    try {
      const base = baseUrl();
      const [daily, weekly, insights] = await Promise.all([
        fetchJson(`${base}/analytics/daily?user_id=1`),
        fetchJson(`${base}/analytics/weekly?user_id=1`),
        fetchJson(`${base}/insights/weekly?user_id=1`),
      ]);

      updateStats(daily, weekly);
      renderPeakHours(daily);
      renderTopDomains(daily);
      renderCategory(weekly);
      renderFocusRatio(weekly);
      renderInsights(insights);
    } catch (err) {
      showToast("Failed to load: " + err.message);
    } finally {
      btn.classList.remove("loading");
      btn.textContent = "↻ Refresh";
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", refresh);
  refresh();
  setInterval(refresh, 60000);
</script>
</body>
</html>
